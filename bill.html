<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Bill | Asha Grill House</title>

    <!-- Cache Prevention -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { width: 100%; max-width: 420px; margin: auto; }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            padding: 30px 25px;
            width: 100%;
            border: 1px solid #e5e7eb;
        }

        .header-title { font-size: 22px; font-weight: 700; text-align: center; color: #d84315; margin-bottom: 5px; }
        .header-sub { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 25px; line-height: 1.5; }

        /* Input Form */
        .form-group { margin-bottom: 20px; }
        .input-wrapper { display: flex; align-items: center; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; transition: border 0.2s; }
        .input-wrapper:focus-within { border-color: #d84315; }
        .input-wrapper input { flex-grow: 1; padding: 14px; border: none; font-size: 16px; outline: none; }

        .btn {
            width: 100%; background-color: #d84315; color: white; border: none; padding: 14px;
            font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer;
            transition: background 0.2s; text-align: center;
        }
        .btn:hover { background-color: #bf360c; }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-outline { background-color: white; color: #374151; border: 1px solid #d1d5db; margin-top: 10px; }

        .error-message { color: #dc2626; background: #fee2e2; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 15px; text-align: center; display: none; }

        /* Receipt View */
        .receipt-head { text-align: center; border-bottom: 1px dashed #d1d5db; padding-bottom: 15px; margin-bottom: 15px; }
        .receipt-head h2 { font-size: 18px; letter-spacing: 0.5px; color: #111827; }
        .receipt-head p { font-size: 12px; color: #4b5563; margin-top: 4px; }

        .info-row { display: flex; font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
        .info-label { width: 80px; font-weight: 600; color: #4b5563; }
        .info-value { flex-grow: 1; font-weight: 500; color: #111827; }

        .section-title { font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin: 15px 0 8px 0; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; }

        .tx-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6; }
        .tx-note { font-size: 11px; color: #6b7280; margin-top: 2px; }

        .msg-item { font-size: 13px; background: #f9fafb; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; border: 1px solid #f3f4f6; }
        .msg-date { font-size: 10px; color: #9ca3af; display: block; margin-top: 3px; }

        .total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin: 15px 0; color: #b91c1c; background: #fef2f2; padding: 12px; border-radius: 8px; border: 1px dashed #f87171; }

        /* Minimalist Accordion for Images */
        details { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 15px; overflow: hidden; }
        summary { padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: #374151; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary:after { content: "▼"; font-size: 10px; color: #9ca3af; }
        details[open] summary:after { content: "▲"; }
        .docs-grid { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .docs-grid img { width: 100%; border-radius: 6px; border: 1px solid #d1d5db; }

        /* Shop Stamp */
        .shop-stamp-container { text-align: center; margin-top: 30px; position: relative; height: 100px; }
        .shop-stamp { width: 120px; opacity: 0.6; transform: rotate(-10deg); filter: grayscale(20%); }

        .hidden { display: none !important; }

        /* Print Optimization */
        @media print {
            body { background: white; padding: 0; }
            .container { max-width: 100%; margin: 0; }
            .card { box-shadow: none; border: none; padding: 0; }
            .print-hidden, details { display: none !important; }
            .shop-stamp { opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- SEARCH SCREEN -->
        <div id="loginScreen" class="card">
            <h2 class="header-title">Bill Portal</h2>
            <p class="header-sub">Enter phone number to fetch your live receipt.</p>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="tel" id="searchInput" placeholder="Enter Phone Number..." onkeypress="if(event.key === 'Enter') fetchBill()" autocomplete="off">
                </div>
            </div>

            <div id="loginError" class="error-message"></div>

            <button id="searchBtn" onclick="fetchBill()" class="btn">Search Bill</button>
        </div>

        <!-- RECEIPT SCREEN -->
        <div id="receiptScreen" class="card hidden">

            <div class="receipt-head">
                <h2>RECEIPT</h2>
                <p>Asha Grill House - Muragachha</p>
                <p>Pro: Biggyan Das - +91 9932134803</p>
            </div>

            <!-- Customer Details -->
            <div class="info-row">
                <div class="info-label">Name:</div>
                <div class="info-value" id="cName"></div>
            </div>
            <div class="info-row">
                <div class="info-label">Phone:</div>
                <div class="info-value" id="cPhone"></div>
            </div>
            <div class="info-row">
                <div class="info-label">Address:</div>
                <div class="info-value" id="cAddress"></div>
            </div>
            <div class="info-row">
                <div class="info-label">Date:</div>
                <div class="info-value" id="cDate"></div>
            </div>

            <!-- Due Block -->
            <div class="total-row">
                <span>Total Due</span>
                <span id="cDue">₹0.00</span>
            </div>

            <!-- Transactions -->
            <div class="section-title">Payment History</div>
            <div id="txList"></div>

            <!-- Messages -->
            <div class="section-title">Notes / Messages</div>
            <div id="msgList"></div>

            <!-- Minimalist Documents Dropdown -->
            <details class="print-hidden" id="docsContainer">
                <summary>View Attached Bills & Documents</summary>
                <div class="docs-grid" id="imagesList"></div>
            </details>

            <!-- Shop Stamp -->
            <div class="shop-stamp-container">
                <!-- Replace src with your actual stamp image URL -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Rubber_Stamp_Approved.svg/640px-Rubber_Stamp_Approved.svg.png" alt="Shop Stamp" class="shop-stamp">
            </div>

            <!-- Actions -->
            <div class="print-hidden" style="margin-top: 20px;">
                <button onclick="window.print()" class="btn">🖨️ Print Receipt</button>
                <button onclick="location.reload()" class="btn btn-outline">Search Another</button>
            </div>

        </div>
    </div>

    <script>
        // 🔗 YOUR GOOGLE SCRIPT WEB APP URL
        const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbx0m8g7vhFwZ8DTGOmhrAK0lMDVOEYhhdJSwh_ZwdB09hcXO7mwztZgBJJNA6WEmt_C/exec";

        // Auto-Search via URL Parameter (?q=9876543210)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');
            if (query) {
                document.getElementById('searchInput').value = query;
                fetchBill();
            }
        });

        async function fetchBill() {
            const searchInput = document.getElementById('searchInput').value.trim();
            const btn = document.getElementById('searchBtn');
            const errorBox = document.getElementById('loginError');

            if (!searchInput) {
                errorBox.innerText = "Please enter a valid number.";
                errorBox.style.display = "block";
                return;
            }

            errorBox.style.display = "none";
            btn.innerText = "Searching...";
            btn.disabled = true;

            const timestamp = new Date().getTime();
            const fetchUrl = `${SPREADSHEET_URL}?bill=${encodeURIComponent(searchInput)}&_nocache=${timestamp}`;

            try {
                const response = await fetch(fetchUrl);
                const text = await response.text();

                let res;
                try { res = JSON.parse(text); }
                catch (e) { throw new Error("Invalid response from server. Check script deployment."); }

                if (res.status === "success" && res.data && res.data.customer) {
                    renderReceipt(res.data);
                } else {
                    throw new Error(res.message || "Record not found.");
                }
            } catch (err) {
                errorBox.innerText = err.message || "Network error. Try again.";
                errorBox.style.display = "block";
                btn.innerText = "Search Bill";
                btn.disabled = false;
            }
        }

        function renderReceipt(data) {
            const cust = data.customer;

            // Switch UI
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('receiptScreen').classList.remove('hidden');

            // Populate Info
            document.getElementById('cName').innerText = cust.name || "N/A";
            document.getElementById('cPhone').innerText = cust.phone || "N/A";
            document.getElementById('cAddress').innerText = cust.address || "N/A";
            document.getElementById('cDate').innerText = cust.createdAt || new Date().toLocaleDateString('en-IN');
            document.getElementById('cDue').innerText = "₹" + (parseFloat(cust.due || 0).toFixed(2));

            // Populate Transactions
            const txList = document.getElementById('txList');
            txList.innerHTML = "";
            if (data.transactions && data.transactions.length > 0) {
                data.transactions.forEach(tx => {
                    const amt = parseFloat(tx.amount || 0).toFixed(2);
                    txList.innerHTML += `
                        <div class="tx-item">
                            <div>
                                <div style="font-weight:600;">${tx.date}</div>
                                <div class="tx-note">${tx.note || 'Payment'}</div>
                            </div>
                            <div style="font-weight:700; color:#059669;">₹${amt}</div>
                        </div>
                    `;
                });
            } else {
                txList.innerHTML = "<div class='tx-note' style='text-align:center;'>No recent payments.</div>";
            }

            // Populate Messages
            const msgList = document.getElementById('msgList');
            msgList.innerHTML = "";
            if (data.messages && data.messages.length > 0) {
                data.messages.forEach(msg => {
                    msgList.innerHTML += `
                        <div class="msg-item">
                            ${msg.text}
                            <span class="msg-date">${msg.date}</span>
                        </div>
                    `;
                });
            } else {
                msgList.innerHTML = "<div class='tx-note' style='text-align:center;'>No messages found.</div>";
            }

            // Populate Images in Minimalist Dropdown
            const docsContainer = document.getElementById('docsContainer');
            const imagesList = document.getElementById('imagesList');
            imagesList.innerHTML = "";

            if (cust.images) {
                const imgArray = cust.images.split(',').map(url => url.trim()).filter(url => url !== "");
                if (imgArray.length > 0) {
                    docsContainer.classList.remove('hidden');
                    imgArray.forEach(url => {
                        // Assuming URLs are standard direct links or drive view links
                        imagesList.innerHTML += `<img src="${url}" alt="Document" loading="lazy">`;
                    });
                } else {
                    docsContainer.classList.add('hidden');
                }
            } else {
                docsContainer.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
